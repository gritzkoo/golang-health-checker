name: build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup golang
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          # go-version: "1.27"
      - name: build package
        run: |
          go mod tidy
          go build -race -a -installsuffix cgo -o entrypoint pkg/**/*.go
